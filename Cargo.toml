[package]
name = "katch2"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]

[[bin]]
name = "nksynth"

[features]
default = ["lb_mincut", "clause_merge"]
# Lower-bound refinement clauses: shrink via a min cut over the abstract
# reachability graph instead of emitting every crossing hole edge
# (`holes::cegis`).
lb_mincut = []
# Collate SMT membership disjuncts by shared input/output set before
# existentializing them (`holes::smt`).
clause_merge = []

[dependencies]
rand = "0.10.0"
clap = { version = "4.5.4", features = ["derive"] }
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
z3 = "0.20.0"
petgraph = "0.8.3"

[dev-dependencies]
# `default-features = false` so the self-reference doesn't force the optional
# optimization features on; without it, feature unification would pin them and
# `--no-default-features` (for tests/benches) would be a no-op.
katch2 = { path = ".", version = "0.1.0", default-features = false }
criterion = "0.8"

[[bench]]
name = "synthesis"
harness = false
