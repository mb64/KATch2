[package]
name = "katch2"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]

[[bin]]
name = "nksynth"

[dependencies]
rustc-hash = "2.1.3"
rand = "0.10.0"
clap = { version = "4.5.4", features = ["derive"] }
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
petgraph = "0.8.3"
rustsat = { version = "0.7.5", default-features = false }
rustsat-cadical = "0.7.5"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "synthesis"
harness = false

[profile.profiling]
inherits = "release"
debug = true
